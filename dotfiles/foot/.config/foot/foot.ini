# foot terminal -- monochrome theme (black / gray / white).

font=JetBrainsMono Nerd Font:size=11

[scrollback]
lines=10000

# colors-dark, not the deprecated [colors]: per foot(5), colors-dark IS the
# default theme unless initial-color-theme=light is set. There is no D-Bus
# /desktop-appearance detection involved -- switching is manual only, via the
# color-theme-switch-* keybindings or SIGUSR1/SIGUSR2. So this applies
# unconditionally, and without the per-option deprecation warning [colors]
# prints on every launch.
[colors-dark]
background=000000
foreground=ffffff

# ---------------------------------------------------------------------------
# Monochrome ANSI palette -- the 16 colors below are a grayscale ramp on
# purpose. Swap in a colored palette HERE if you ever want distinction in
# git diffs / ls output; nothing else in this file needs to change.
# ---------------------------------------------------------------------------
# "black" .. "white" (normal)
regular0=1a1a1a
regular1=8a8a8a
regular2=9a9a9a
regular3=aaaaaa
regular4=7a7a7a
regular5=b4b4b4
regular6=c4c4c4
regular7=d4d4d4
# bright variants
bright0=3a3a3a
bright1=a8a8a8
bright2=b8b8b8
bright3=c8c8c8
bright4=989898
bright5=d8d8d8
bright6=e8e8e8
bright7=ffffff
